set -g mouse on
set -g focus-events on
set-environment -g LANG en_US.UTF-8
set-environment -g LC_ALL en_US.UTF-8

# Use tmux-256color inside tmux (proper terminfo for mouse, keys, etc.)
# then add true color override for alacritty on the outside
set -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ",alacritty:Tc"
set-option -ga terminal-features ",alacritty:RGB"

# Increase tmux scrollback buffer
set -g history-limit 50000

# Clipboard
set -s copy-command 'wl-copy'
set -g set-clipboard on

# Vi-style copy mode
set-window-option -g mode-keys vi

# Copy mode bindings
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi Space send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"
